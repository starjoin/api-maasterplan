# Volume nommé : obligatoire pour garder GTFS/NeTEx entre redéploiements.
# Sur Coolify (Dockerfile) : ajouter un Storage Destination Path = /app/data
# Sur Coolify (Compose) : ce volume `maasterplan_data` suffit.
services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=file:/app/data/maasterplan.db
      - DATABASE_URL_GTFS=file:/app/data/maasterplan.db
      - DATABASE_URL_NETEX=file:/app/data/netex.db
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=384
      - IMPORT_HEAP_MB=768
      - IMPORT_RSS_MB=1400
      - IMPORT_BATCH_SIZE=500
      - AUTO_IMPORT_ON_START=false
      - TMP_DIR=/app/data/tmp
    volumes:
      - maasterplan_data:/app/data
    init: true
    mem_limit: 2300m
    mem_reservation: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  maasterplan_data:
